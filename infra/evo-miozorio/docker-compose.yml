# Evolution API dedicada da Mi Ozorio (isolada do Bibi).
# Imagem :latest = puxa a versão atual (corrige o bug de QR da v2.2.3).
# Cole este conteúdo num serviço Compose do Dokploy (projeto miozorio).

services:
  evolution-api:
    image: atendai/evolution-api:latest
    restart: always
    environment:
      # ⚠️ Ajuste SERVER_URL para o domínio que o Dokploy gerar para este serviço.
      SERVER_URL: https://evo-miozorio-zlfnve-4bac90-76-13-230-78.traefik.me
      AUTHENTICATION_API_KEY: "160ed8d022040cf6e6d466c993047cfaec3aceb53539d9b8"
      AUTHENTICATION_TYPE: apikey
      # Banco (Postgres dedicado abaixo)
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evo:160ed8d022040cf6@evo-postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evo_miozorio
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache Redis dedicado
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evo-redis:6379/0
      CACHE_REDIS_PREFIX_KEY: evo_miozorio
      CACHE_LOCAL_ENABLED: "false"
      # QR / log
      QRCODE_LIMIT: "30"
      CONFIG_SESSION_PHONE_VERSION: "2.3000.1035194821"
      LOG_LEVEL: ERROR
    depends_on:
      - evo-postgres
      - evo-redis

  evo-postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: evo
      POSTGRES_PASSWORD: "160ed8d022040cf6"
      POSTGRES_DB: evolution
    volumes:
      - evo_pg:/var/lib/postgresql/data

  evo-redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - evo_redis:/data

volumes:
  evo_pg:
  evo_redis:
